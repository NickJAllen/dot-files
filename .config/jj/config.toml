[user]
name = "Nicholas Allen"
email = "radicalnick@gmail.com"

[ui]
editor = "nvim"

# Use difftastic for syntax based diffs
#diff-formatter = ["difft", "--color=always", "$left", "$right"]

[aliases]
branch_name = ["log", "-r", 'closest_bookmarks(first_ancestors(@))', "--no-graph", "-T", 'bookmarks.map(|x| x.name()).join(", ")']

[revsets]
# log = 'present(@) | ancestors(immutable_heads().., 15) | trunk()'
log = 'first_ancestors(@)|descendants(@-)'

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | ~mine()"
"closest_bookmarks()" = "heads(::@ & bookmarks()|remote_bookmarks())"
"closest_bookmarks(x)" = "heads(::x & bookmarks())"
